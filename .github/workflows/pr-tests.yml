name: Test source runtime
on:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Set fixture paths
        run: |
          echo "DEVTOOL_FIXTURE_ROOT=$RUNNER_TEMP/devtool-fixture" >> "$GITHUB_ENV"
          echo "DEVTOOL_DATA_ROOT=$RUNNER_TEMP/devtool-data" >> "$GITHUB_ENV"
          echo "DEVTOOL_CACHE_ROOT=$RUNNER_TEMP/devtool-cache" >> "$GITHUB_ENV"
      - name: Check existing engine
        run: |
          docker version
          docker compose version
          docker buildx version
      - run: npm run test:integration
      - name: Capture diagnostics
        if: failure()
        run: |
          docker ps --all
          find "$DEVTOOL_DATA_ROOT" "$DEVTOOL_CACHE_ROOT" -maxdepth 5 -type f -name '*.json' -print -exec cat {} \; || true
          cat "$DEVTOOL_FIXTURE_ROOT/build-error" 2>/dev/null || true
      - name: Clean fixture resources
        if: always()
        run: |
          for project in first second; do
            if [ -f "$DEVTOOL_FIXTURE_ROOT/$project/.devtool.yml" ]; then
              node bin/devtool.js --file "$DEVTOOL_FIXTURE_ROOT/$project/.devtool.yml" destroy
            fi
          done
