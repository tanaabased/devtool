name: Test source runtime
on:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Set fixture paths
        run: |
          echo "DEVTOOL_FIXTURE_ROOT=$RUNNER_TEMP/devtool-fixture" >> "$GITHUB_ENV"
          echo "DEVTOOL_DATA_ROOT=$RUNNER_TEMP/devtool-data" >> "$GITHUB_ENV"
          echo "DEVTOOL_CACHE_ROOT=$RUNNER_TEMP/devtool-cache" >> "$GITHUB_ENV"
      - name: Check existing engine
        run: |
          docker version
          docker compose version
          docker buildx version
      - run: bun run test:integration
      - name: Save exec latency baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-source-exec-latency
          path: ${{ runner.temp }}/devtool-fixture/exec-latency.json
          if-no-files-found: ignore
      - name: Capture diagnostics
        if: failure()
        run: |
          docker ps --all
          find "$DEVTOOL_DATA_ROOT" "$DEVTOOL_CACHE_ROOT" -maxdepth 5 -type f -name '*.json' -print -exec cat {} \; || true
          cat "$DEVTOOL_FIXTURE_ROOT/build-error" "$DEVTOOL_FIXTURE_ROOT/lando/failure.log" 2>/dev/null || true
      - name: Clean fixture resources
        if: always()
        run: bun examples/cleanup.js
