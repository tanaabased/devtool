name: Exec Timing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: tanaabased/actions/setup-bun@v1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun scripts/measure-exec-cli.ts
      - uses: actions/upload-artifact@v4
        with:
          name: exec-timing
          path: |
            exec-timing.json
            exec-timing.md
