name: Example Tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    name: ${{ matrix.suite }} / ${{ matrix.interface }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: source
            interface: CLI
            scenarios: examples/source/README.md
            timeout: 10
          - suite: source
            interface: Library
            scenarios: examples/source/README.md
            timeout: 10
          - suite: lifecycle
            interface: CLI
            scenarios: |
              examples/l337/README.md
              examples/lando/README.md
            timeout: 300
          - suite: lifecycle
            interface: Library
            scenarios: examples/consumer/README.md
            timeout: 300
    env:
      LEIA_TEST_HEADER: Testing ${{ matrix.interface }}
      LEIA_TIMEOUT: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7
      - uses: tanaabased/actions/setup-bun@v1
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Set fixture paths
        id: fixtures
        if: matrix.suite == 'lifecycle'
        env:
          DEVTOOL_TEST_INTERFACE: ${{ matrix.interface }}
        run: |
          echo "DEVTOOL_FIXTURE_ROOT=$RUNNER_TEMP/devtool-$DEVTOOL_TEST_INTERFACE/fixture" >> "$GITHUB_ENV"
          echo "DEVTOOL_DATA_ROOT=$RUNNER_TEMP/devtool-$DEVTOOL_TEST_INTERFACE/data" >> "$GITHUB_ENV"
          echo "DEVTOOL_CACHE_ROOT=$RUNNER_TEMP/devtool-$DEVTOOL_TEST_INTERFACE/cache" >> "$GITHUB_ENV"
      - name: Prepare source command
        if: matrix.interface == 'CLI'
        run: |
          bun run prepare:source-cli
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check existing engine
        if: matrix.suite == 'lifecycle'
        run: |
          docker version
          docker compose version
          docker buildx version
      - name: Run Leia scenarios
        uses: tanaabased/actions/run-leia@v1
        with:
          scenarios: ${{ matrix.scenarios }}
          shell: bash
          retry: 0
          stdin: false
      - name: Measure paired source startup
        if: matrix.suite == 'lifecycle' && matrix.interface == 'CLI'
        continue-on-error: true
        env:
          DEVTOOL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/measure-source-startup.ts
      - name: Capture diagnostics
        if: failure() && matrix.suite == 'lifecycle'
        run: |
          docker ps --all
          find "$DEVTOOL_FIXTURE_ROOT" "$DEVTOOL_DATA_ROOT" "$DEVTOOL_CACHE_ROOT" -maxdepth 8 -type f -name '*.json' -print -exec cat {} \; || true
          cat "$DEVTOOL_FIXTURE_ROOT/build-error" "$DEVTOOL_FIXTURE_ROOT/lando/failure.log" 2>/dev/null || true
      - name: Clean fixture resources
        if: always() && matrix.suite == 'lifecycle' && steps.fixtures.conclusion == 'success'
        run: bun examples/cleanup.ts
